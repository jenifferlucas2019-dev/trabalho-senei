<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Segurança do Trabalho</title>
</head>
<body>
    <img id="img-principal" src="img/segurança.png" alt="Segurança do Trabalho"/>
    <h1>Segurança do Trabalho</h1>

    <div id="form">
        <div class="container-inputs">
            <label for="input-nome">Nome:</label>
            <input id="input-nome" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-setor">Setor:</label>
            <input id="input-setor" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-funcao">Função:</label>
            <input id="input-funcao" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-data">Data:</label>
            <input id="input-data" type="date">
        </div>
        <div class="container-inputs" id="div-id">
            <label for="input-validade">Validade:</label>
            <input id="input-validade" type="text">
        </div>

        <button onclick="cadastrarFuncionario()">Cadastrar Funcionário</button>
        <button onclick="procurarFuncionario()">🔍 Buscar</button>
        <button onclick="excluirFuncionario()">🗑️ Excluir</button>
    </div>

    <div id="painel-funcionario"></div>

    <script src="script.js"></script>
</body>
</html>
